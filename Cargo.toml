[workspace]
resolver = "2"
members = [
  "crates/koto-core",
  "crates/koto-hypr",
  "crates/koto-input",
  "crates/koto-observe",
  "crates/koto-policy",
  "crates/koto-tmux",
  "crates/koto-cli",
  "crates/libkoto",
]
default-members = ["crates/koto-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kowo-co/koto"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
